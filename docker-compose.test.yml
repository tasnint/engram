services:
  mongo:
    image: mongo:9.0.4
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - 127.0.0.1:${MONGODB_PORT:-27018}:27017
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --eval ''try { if (!rs.status().ok) quit(1); } catch { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);'''
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - engram-test-data:/data/db
volumes:
  engram-test-data:
