# mongod for local development. Search needs a replica set, so this is a
# single-member replica set ("rs0"). No access control: local use only.
net:
  port: 27017
  bindIpAll: true
replication:
  replSetName: rs0
setParameter:
  # Where mongod sends search queries and search index commands (the mongot service).
  searchIndexManagementHostAndPort: mongot:27028
  mongotHost: mongot:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true
  searchTLSMode: disabled
